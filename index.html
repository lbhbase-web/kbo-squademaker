<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>컴프야V26 스쿼드 메이커</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .mode-selector {
            margin: 20px 0;
        }
        .mode-btn {
            padding: 8px 16px;
            margin: 0 5px;
            border: 1px solid #ccc;
            background: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .mode-btn.active {
            background: #4a69bd;
            color: white;
            border-color: #4a69bd;
        }
        .info-panel {
            display: flex;
            justify-content: space-around;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #eee;
        }
        .info-box h3 {
            margin: 0 0 5px 0;
            font-size: 14px;
            color: #666;
        }
        .info-box p {
            margin: 0;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
        .squad-board {
            min-height: 300px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            background: #fafafa;
        }
    </style>
</head>
<body>

        <p>선수 카드를 배치하여 나만의 최적의 스쿼드를 만들어보세요!</p>

        <!-- 게임 모드 선택 영역 -->
        <div class="mode-selector">
            <button class="mode-btn active" data-mode="ranking">랭킹 챌린지</button>
            <button class="mode-btn" data-mode="real">실시간 매치</button>
            <button class="mode-btn" data-mode="club">클럽 대전</button>
            <button class="mode-btn" data-mode="league">리그 모드</button>
            <button class="mode-btn" data-mode="special">스페셜 매치</button>
        </div>

        <!-- 상단 정보 패널 (세트덱, OVR, 역시너지 현황) -->
        <div class="info-panel">
            <div class="info-box">
                <h3>총 세트덱 포인트</h3>
                <p id="total-setdeck">0</p>
            </div>
            <div class="info-box">
                <h3>총 OVR</h3>
                <p id="total-ovr">0</p>
            </div>
            <div class="info-box">
                <h3>현재 선택 모드</h3>
                <p id="display-mode">랭킹 챌린지</p>
            </div>
            <div class="info-box">
                <h3>역시너지 페널티</h3>
                <p id="penalty-score" style="color: #e74c3c;">0</p>
            </div>
        </div>

        <!-- 선수 배치 그라운드 -->
        <div class="squad-board" id="squad-board">
            선수 배치 그라운드 (이곳에 라인업 카드가 표시됩니다)
        </div>
    </div>

            button.addEventListener('click', (e) => {
                modeButtons.forEach(btn => btn.classList.remove('active'));

</body>
</html>
