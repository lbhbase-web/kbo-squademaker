<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBO V26 Squad Maker</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .squad-board {
            min-height: 400px;
            border: 2px dashed #ccc;
            border-radius: 8px;
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>KBO V26 Squad Maker</h1>
        <p>26 라이브 선수 카드를 배치하여 나만의 스쿼드를 만들어보세요!</p>
        
        <div class="squad-board">
            선수 배치 그라운드 (여기에 카드가 들어갑니다)
        </div>
    </div>
</body>
</html>
